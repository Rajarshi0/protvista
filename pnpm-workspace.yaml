# pnpm settings file. Not a monorepo — pnpm ≥11 reads its configuration from
# here rather than from a "pnpm" field in package.json, so this file exists
# even though there is only one package.

# pnpm blocks dependency install/postinstall scripts unless they are allowed
# here. Each entry is a deliberate decision, not a formality: a build script
# runs third-party code at install time.
# Run package.json scripts in pnpm's built-in POSIX shell on every OS,
# instead of cmd.exe on Windows. Scripts here are written for sh: a
# `VAR=1 vitest …` prefix (adapters:sync, vocabulary:sync) is a syntax error
# in cmd, and cmd passes single quotes through to the program. With the
# emulator, Windows contributors can run every script except the ./scripts
# *.sh maintainer tools (which need Git Bash or WSL) unchanged.
shellEmulator: true

allowBuilds:
  # Required. esbuild's postinstall places the platform binary; without it
  # every vite and vitest run fails to start. Two majors are in the tree
  # (vite's current one and an old one pulled in transitively).
  esbuild: true

  # Optional native canvas for jsdom. jsdom works without it (nothing in the
  # suite rasterises through the jsdom canvas path) and building it needs
  # node-gyp plus system libs, so leave it unbuilt.
  canvas: false

  # Headless WebGL bindings reached through the structure viewer's dependency
  # tree. Same reasoning as canvas: native build, unused by the test suite.
  gl: false

  # Install-time telemetry ping. Nothing depends on it running.
  '@scarf/scarf': false

# pnpm refuses packages published less than a day ago (minimumReleaseAge), a
# guard against a compromised release reaching us before anyone notices. The
# Nightingale packages are maintained by the same team as this one, and a
# Nightingale fix often needs to ship here the day it is released, so every
# version of every @nightingale-elements package is exempt. Everything else
# still waits its day.
minimumReleaseAgeExclude:
  - '@nightingale-elements/*'

# Overrides force a patched version of a dependency that a parent package pins
# exactly, so `pnpm audit --fix update` can't move it. They apply to this
# repo's installs only — overrides are not published, so consumers still get
# whatever the parent declares.
overrides:
  # Nightingale pins lodash-es exactly (filter 4.17.11, track and variation
  # 4.17.15), all with known advisories. Same major, so a safe stopgap; remove
  # once Nightingale relaxes the pins and the fix ships to consumers too.
  lodash-es: ^4.18.1

  # vite-plugin-svgo pins svgo 4.0.1, whose removeScripts plugin has
  # advisories. Build-time only, and only ever runs over our own icons.
  svgo: ^4.1.0
