# Real per-residue conservation as a line graph, beside what UniProt says
# about the same protein: rubredoxin from Pyrococcus furiosus (P24297,
# 54 residues).
#
# conservation.csv and conserved-sites.csv are generated by
# scripts/conservation/build.mjs from the Pfam PF00301 full alignment (5,852
# sequences, Pfam 38.2). Each score is the Jensen–Shannon divergence of the
# residue's alignment column from the BLOSUM62 background (Capra & Singh
# 2007), with Henikoff sequence weights and a gap penalty. PROVENANCE.md,
# beside this file, gives the method, the releases and the checksums.
#
# Reading the numbers:
#   - They measure conservation within the Pfam rubredoxin family, not a
#     whole-protein evolutionary rate.
#   - The score rewards rare residues: an invariant C or W outscores an
#     invariant L.
#   - Residues 1–3 and 50–54 lie outside the Pfam domain and have no score.
#   - The line graph's y-axis is fitted to the data, not to 0–1.
#   - The line has no tooltip of its own, so the most conserved residues
#     show their scores in theirs (the `dataTooltip` below; a `kind:
#     features` track's own tooltip leaves extra columns such as `score` out).
#   - The numbers belong to P24297. Drawn on another protein they would mean
#     nothing, even where they are in range.
# UniProt's four iron-binding cysteines (6, 9, 39 and 42) have the four
# highest scores.
#
# Attribution: Pfam and InterPro data are CC0 1.0. UniProt data are CC BY
# 4.0: The UniProt Consortium, UniProtKB entry P24297 (release 2026_03),
# https://www.uniprot.org/uniprotkb/P24297.
#
# NOTE: `./conservation.csv` and `./conserved-sites.csv` resolve against the
# *hosting page*, not this config file — see the path gotcha in
# examples/README.md.
accession: P24297
sources:
  features: https://www.ebi.ac.uk/proteins/api/features/{accession}
rows:
  - id: conservation
    label: Conservation (Pfam PF00301)
    kind: linegraph
    description: Per-residue conservation across the Pfam rubredoxin family (Jensen–Shannon divergence; higher is more conserved)
    data: ./conservation.csv
  - id: conserved_sites
    label: Most conserved residues
    kind: features
    description: Residues at or above the 90th percentile of conservation, with their scores
    data: ./conserved-sites.csv
    dataTooltip:
      kind: fields
      fields:
        - { path: start, label: Residue }
        - { path: score, label: Conservation score }
        - { path: description, label: Why it is shown }
  - id: binding_sites
    label: UniProt binding sites
    kind: features
    filter: BINDING
    data: features
    description: Binding sites from UniProt for {accession}
